name: West Bengal DCMG ST-GNN Training

on:
  push:
    branches: [main]
    paths:
      - "wb_model_train.py"
      - ".github/workflows/wb_model_train.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scikit-learn
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Train West Bengal models
        run: python wb_model_train.py

      - name: Persist results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wb_outputs/*.csv wb_outputs/*.json
          if git diff --cached --quiet; then
            echo "No result changes to commit."
          else
            git commit -m "Add West Bengal DCMG ST-GNN results"
            git push
          fi
