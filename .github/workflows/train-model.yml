name: Train OneHealth ST-GNN

on:
  push:
    branches: [main]
    paths:
      - "train_model.py"
      - ".github/workflows/train-model.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install numpy torch

      - name: Train
        run: |
          echo "Training from original Hungarian chickenpox case counts"
          python train_model.py

      - name: Commit model files to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add model_artifacts/
          git diff --cached --quiet || git commit -m "Update trained ST-GNN model"
          git pull --rebase origin main
          git push
